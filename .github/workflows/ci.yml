name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build and verify capsule evaluator image
        run: |
          docker build -t powerplant-evaluator:node-test-js-v1 docker/capsule-v1/
          ACTUAL_ID=$(docker image inspect powerplant-evaluator:node-test-js-v1 --format '{{.Id}}')
          EXPECTED_ID=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('docker/capsule-v1/build-manifest.json','utf8')); process.stdout.write(m.imageId)")
          if [ "$ACTUAL_ID" != "$EXPECTED_ID" ]; then
            echo "CAPSULE_IMAGE_IDENTITY_MISMATCH: expected $EXPECTED_ID, got $ACTUAL_ID"
            exit 1
          fi
          echo "Capsule image identity verified: $ACTUAL_ID"

      - name: Test
        run: npm test
        # No .env file is present in CI. Repository-contained unit tests pass
        # without any secrets. Pilot-dependent integration tests
        # (tests/*pilot*, tests/*patch-package*, tests/*load-project-contract*)
        # are automatically skipped when SPRINT4A_PILOT_SOURCE_PATH is unset.
        # Live broker/session entrypoints are in tests/**/*.live.test.ts and are
        # excluded from npm test by vitest.config.ts.
