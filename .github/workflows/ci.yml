name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # docker/login-action v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull approved capsule image by immutable registry digest
        run: |
          CANONICAL="ghcr.io/rbardyla-boop/claude_powerplant/capsule-v1@sha256:b9b3f12dada01a7b95d58688ddd1185df2c8500f39b15133c45d94fe7eec506e"
          docker pull "${CANONICAL}"
          REPO_DIGESTS=$(docker image inspect "${CANONICAL}" --format '{{json .RepoDigests}}')
          echo "Resolved RepoDigests: ${REPO_DIGESTS}"
          if ! echo "${REPO_DIGESTS}" | grep -qF "sha256:b9b3f12dada01a7b95d58688ddd1185df2c8500f39b15133c45d94fe7eec506e"; then
            echo "CAPSULE_REGISTRY_DIGEST_MISMATCH: approved digest not found in resolved RepoDigests"
            echo "Expected: ${CANONICAL}"
            echo "Got: ${REPO_DIGESTS}"
            exit 1
          fi
          echo "Capsule registry digest verified: ${CANONICAL}"

      - name: Test
        run: npm test
        # No .env file is present in CI. Repository-contained unit tests pass
        # without any secrets. Pilot-dependent integration tests
        # (tests/*pilot*, tests/*patch-package*, tests/*load-project-contract*)
        # are automatically skipped when SPRINT4A_PILOT_SOURCE_PATH is unset.
        # Live broker/session entrypoints are in tests/**/*.live.test.ts and are
        # excluded from npm test by vitest.config.ts.
